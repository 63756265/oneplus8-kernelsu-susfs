name: Build SukiSU-Ultra OnePlus 8T (kebab)

on:
  workflow_dispatch:
    inputs:
      KERNEL_PROFILE:
        type: choice
        description: "内核来源 (默认 los23 最稳；库存 OOS 可试 meteoric14/oos)"
        required: true
        default: los23
        options:
          - los23
          - meteoric14
          - oos
          - stock_oss_a14
      ENABLE_SUSFS:
        type: boolean
        description: "启用 SUSFS？"
        required: true
        default: true
      ENABLE_KPM:
        type: boolean
        description: "启用 KPM？(non-GKI 需 KALLSYMS)"
        required: true
        default: true

env:
  DEFCONFIG: vendor/kona-perf_defconfig
  DEVICE_CODENAME: kebab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Resolve kernel profile
        run: |
          case "${{ github.event.inputs.KERNEL_PROFILE }}" in
            meteoric14)
              echo "KERNEL_SOURCE=https://github.com/HELLBOY017/kernel_oneplus_sm8250.git" >> $GITHUB_ENV
              echo "KERNEL_BRANCH=14" >> $GITHUB_ENV
              echo "APPLY_LOS_FIXES=false" >> $GITHUB_ENV
              echo "PROFILE_LABEL=Meteoric14" >> $GITHUB_ENV
              ;;
            oos)
              echo "KERNEL_SOURCE=https://github.com/HELLBOY017/kernel_oneplus_sm8250.git" >> $GITHUB_ENV
              echo "KERNEL_BRANCH=oos" >> $GITHUB_ENV
              echo "APPLY_LOS_FIXES=false" >> $GITHUB_ENV
              echo "PROFILE_LABEL=OOS" >> $GITHUB_ENV
              ;;
            los23)
              echo "KERNEL_SOURCE=https://github.com/LineageOS/android_kernel_oneplus_sm8250.git" >> $GITHUB_ENV
              echo "KERNEL_BRANCH=lineage-23.0" >> $GITHUB_ENV
              echo "APPLY_LOS_FIXES=true" >> $GITHUB_ENV
              echo "PROFILE_LABEL=LOS23" >> $GITHUB_ENV
              ;;
            stock_oss_a14)
              echo "KERNEL_SOURCE=https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git" >> $GITHUB_ENV
              echo "KERNEL_BRANCH=oneplus/sm8250_u_14.0.0_op8t" >> $GITHUB_ENV
              echo "APPLY_LOS_FIXES=false" >> $GITHUB_ENV
              echo "PROFILE_LABEL=StockOSS_A14" >> $GITHUB_ENV
              ;;
          esac
          echo "ENABLE_SUSFS=${{ github.event.inputs.ENABLE_SUSFS }}" >> $GITHUB_ENV
          echo "ENABLE_KPM=${{ github.event.inputs.ENABLE_KPM }}" >> $GITHUB_ENV
          echo "Selected profile=${{ github.event.inputs.KERNEL_PROFILE }}"

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget bc bison build-essential flex \
            libssl-dev libelf-dev python3 cpio zip android-sdk-libsparse-utils lz4

      - name: Setup mkbootimg tools
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg
          chmod +x mkbootimg/*.py
          echo "$GITHUB_WORKSPACE/mkbootimg" >> $GITHUB_PATH

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchains/clang
          key: clang-14.0.6-20250704

      - name: Setup Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/clang
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz" | \
            tar -xzf - -C toolchains/clang

      - name: Add Clang to PATH
        run: echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH

      - name: Cache GCC Toolchains
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: |
            toolchains/gcc64
            toolchains/gcc32
          key: gcc-android12L-aarch64-arm

      - name: Setup GCC
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc32

      - name: Add GCC to PATH
        run: |
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> $GITHUB_PATH

      - name: Clone Kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          # Meteoric 等树可能带损坏的 KernelSU submodule / drivers/ksu 软链
          if [ -L drivers/ksu ] || [ -d drivers/ksu ]; then
            echo "Removing pre-existing drivers/ksu"
            rm -rf drivers/ksu
          fi
          if [ -d KernelSU ] || [ -L KernelSU ]; then
            echo "Removing pre-existing KernelSU"
            rm -rf KernelSU
          fi
          # 去掉已失效的 ksu/kernelsu Kconfig source，交给后续 setup.sh 重新写入
          if [ -f drivers/Kconfig ]; then
            sed -i '/ksu\/Kconfig/d;/kernelsu\/Kconfig/d' drivers/Kconfig || true
          fi

      - name: Fix LineageOS 23 Bugs
        if: env.APPLY_LOS_FIXES == 'true'
        run: |
          cd kernel

          # Fix qpnp-power-on.c
          sed -i 's/if (pon->log_kpd_event && (cfg->pon_type == PON_KPDPWR))/if (0)/' drivers/input/misc/qpnp-power-on.c
          sed -i 's/if (pon->log_kpd_event) {/if (0) {/' drivers/input/misc/qpnp-power-on.c
          sed -i '/pon->log_kpd_event = of_property_read_bool/,/"qcom,log-kpd-event");/d' drivers/input/misc/qpnp-power-on.c

          # Fix get_cached_platform_id
          for f in $(grep -rl "get_cached_platform_id" --include="*.c" .); do
            sed -i '1i #ifndef get_cached_platform_id\n#define get_cached_platform_id() 0\n#endif' "$f"
          done

          # Fix schgm-flash.h
          sed -i '1i struct smb_charger;' drivers/power/supply/qcom/schgm-flash.h || true
          sed -i '/#include "schgm-flash.h"/a #include "smb5-lib.h"' drivers/power/supply/qcom/schgm-flash.c || true

          # Fix ion_system_heap.c
          sed -i 's/global_zone_page_state(NR_IONCACHE_PAGES)/0/g' drivers/staging/android/ion/ion_system_heap.c || true

          # Create stub file for missing OnePlus functions
          cat > drivers/soc/oplus/oplus_stubs.c << 'EOFSTUB'
          // Stubs for missing OnePlus functions
          #include <linux/module.h>
          void hans_report(int a, int b, int c, char* d) {}
          EXPORT_SYMBOL(hans_report);
          int get_boot_mode(void) { return 0; }
          EXPORT_SYMBOL(get_boot_mode);
          int get_eng_version(void) { return 0; }
          EXPORT_SYMBOL(get_eng_version);
          int oplus_daily_build(void) { return 0; }
          EXPORT_SYMBOL(oplus_daily_build);
          int kswapd_threads = 1;
          EXPORT_SYMBOL(kswapd_threads);
          int oplus_vooc_adapter_update_is_rx_gpio(void) { return 0; }
          EXPORT_SYMBOL(oplus_vooc_adapter_update_is_rx_gpio);
          int oplus_vooc_adapter_update_is_tx_gpio(void) { return 0; }
          EXPORT_SYMBOL(oplus_vooc_adapter_update_is_tx_gpio);
          int get_project(void) { return 0; }
          EXPORT_SYMBOL(get_project);
          int is_confidential(void) { return 0; }
          EXPORT_SYMBOL(is_confidential);
          void oplus_wpc_set_wrx_en_value(int a) {}
          EXPORT_SYMBOL(oplus_wpc_set_wrx_en_value);
          void opchg_set_pd_sdp(int a) {}
          EXPORT_SYMBOL(opchg_set_pd_sdp);
          void black_screen_timer_restart(void) {}
          EXPORT_SYMBOL(black_screen_timer_restart);
          void bright_screen_timer_restart(void) {}
          EXPORT_SYMBOL(bright_screen_timer_restart);
          int oplus_vooc_get_fastchg_started(void) { return 0; }
          EXPORT_SYMBOL(oplus_vooc_get_fastchg_started);
          int oplus_vooc_get_fastchg_ing(void) { return 0; }
          EXPORT_SYMBOL(oplus_vooc_get_fastchg_ing);
          int oplus_gauge_init(void *a) { return 0; }
          EXPORT_SYMBOL(oplus_gauge_init);
          int get_PCB_Version(void) { return 0; }
          EXPORT_SYMBOL(get_PCB_Version);
          void switch_headset_state(int a) {}
          EXPORT_SYMBOL(switch_headset_state);
          int opticalfp_irq_handler_register(void *a) { return 0; }
          EXPORT_SYMBOL(opticalfp_irq_handler_register);
          int is_project(int a) { return 0; }
          EXPORT_SYMBOL(is_project);
          int smblib_write(void *chg, int reg, int val) { return 0; }
          EXPORT_SYMBOL(smblib_write);
          int smblib_read(void *chg, int reg, int *val) { return 0; }
          EXPORT_SYMBOL(smblib_read);
          int smblib_masked_write(void *chg, int reg, int mask, int val) { return 0; }
          EXPORT_SYMBOL(smblib_masked_write);
          int qpnp_is_power_off_charging(void) { return 0; }
          EXPORT_SYMBOL(qpnp_is_power_off_charging);
          EOFSTUB
          echo 'obj-y += oplus_stubs.o' >> drivers/soc/oplus/Makefile

      - name: Apply SUSFS v2.0.0 patches
        if: env.ENABLE_SUSFS == 'true'
        run: |
          cd kernel
          echo "Applying SUSFS v2.0.0 patches..."

          # Apply SUSFS source files
          patch -p1 --no-backup-if-mismatch -F3 < $GITHUB_WORKSPACE/susfs-patches/00_add_susfs_source.patch || true

          # Apply SUSFS kernel hooks
          patch -p1 --no-backup-if-mismatch -F3 < $GITHUB_WORKSPACE/susfs-patches/01_add_susfs_hooks.patch || true

          # Apply misc SUSFS patches
          patch -p1 --no-backup-if-mismatch -F3 < $GITHUB_WORKSPACE/susfs-patches/02_add_susfs_misc.patch || true

          # Apply LineageOS-specific fixes
          patch -p1 --no-backup-if-mismatch -F3 < $GITHUB_WORKSPACE/susfs-patches/03_fix_exec.patch || true
          patch -p1 --no-backup-if-mismatch -F3 < $GITHUB_WORKSPACE/susfs-patches/04_fix_namespace_clone_mnt.patch || true
          patch -p1 --no-backup-if-mismatch -F3 < $GITHUB_WORKSPACE/susfs-patches/05_fix_task_mmu.patch || true

          # Cleanup
          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true

          # Update fs/Makefile for SUSFS
          if ! grep -q "susfs.o" fs/Makefile; then
            sed -i '/^obj-y.*:=/a obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          fi

      - name: Backport path_umount and get_cred_rcu
        run: |
          cd kernel
          echo "Adding kernel backports for 4.19..."

          if ! grep -q "^static int can_umount" fs/namespace.c; then
            echo "" >> fs/namespace.c
            echo "/* Backport can_umount for SUSFS/KernelSU */" >> fs/namespace.c
            echo "static int can_umount(const struct path *path, int flags)" >> fs/namespace.c
            echo "{" >> fs/namespace.c
            echo "    struct mount *mnt = real_mount(path->mnt);" >> fs/namespace.c
            echo "    if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))" >> fs/namespace.c
            echo "        return -EINVAL;" >> fs/namespace.c
            echo "    if (!may_mount())" >> fs/namespace.c
            echo "        return -EPERM;" >> fs/namespace.c
            echo "    if (path->dentry != path->mnt->mnt_root)" >> fs/namespace.c
            echo "        return -EINVAL;" >> fs/namespace.c
            echo "    if (!check_mnt(mnt))" >> fs/namespace.c
            echo "        return -EINVAL;" >> fs/namespace.c
            echo "    if (mnt->mnt.mnt_flags & MNT_LOCKED)" >> fs/namespace.c
            echo "        return -EINVAL;" >> fs/namespace.c
            echo "    if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))" >> fs/namespace.c
            echo "        return -EPERM;" >> fs/namespace.c
            echo "    return 0;" >> fs/namespace.c
            echo "}" >> fs/namespace.c
          fi

          if ! grep -q "^int path_umount" fs/namespace.c; then
            echo "" >> fs/namespace.c
            echo "/* Backport path_umount from Linux 5.9+ for KernelSU/SUSFS */" >> fs/namespace.c
            echo "int path_umount(struct path *path, int flags)" >> fs/namespace.c
            echo "{" >> fs/namespace.c
            echo "    struct mount *mnt = real_mount(path->mnt);" >> fs/namespace.c
            echo "    int ret;" >> fs/namespace.c
            echo "    ret = can_umount(path, flags);" >> fs/namespace.c
            echo "    if (!ret)" >> fs/namespace.c
            echo "        ret = do_umount(mnt, flags);" >> fs/namespace.c
            echo "    dput(path->dentry);" >> fs/namespace.c
            echo "    mntput_no_expire(mnt);" >> fs/namespace.c
            echo "    return ret;" >> fs/namespace.c
            echo "}" >> fs/namespace.c
            echo "EXPORT_SYMBOL(path_umount);" >> fs/namespace.c
          fi

          if ! grep -q "int path_umount" fs/internal.h; then
            sed -i '/^extern void __init mnt_init/a int path_umount(struct path *path, int flags);' fs/internal.h
          fi

          if ! grep -q "get_cred_rcu" include/linux/cred.h; then
            echo "Adding get_cred_rcu backport..."
            echo "" > /tmp/get_cred_rcu.txt
            echo "/* Backport get_cred_rcu for KernelSU */" >> /tmp/get_cred_rcu.txt
            echo "static inline const struct cred *get_cred_rcu(const struct cred *cred)" >> /tmp/get_cred_rcu.txt
            echo "{" >> /tmp/get_cred_rcu.txt
            echo "    struct cred *nonconst_cred = (struct cred *) cred;" >> /tmp/get_cred_rcu.txt
            echo "    if (!cred)" >> /tmp/get_cred_rcu.txt
            echo "        return NULL;" >> /tmp/get_cred_rcu.txt
            echo "    if (!atomic_inc_not_zero(&nonconst_cred->usage))" >> /tmp/get_cred_rcu.txt
            echo "        return NULL;" >> /tmp/get_cred_rcu.txt
            echo "    return cred;" >> /tmp/get_cred_rcu.txt
            echo "}" >> /tmp/get_cred_rcu.txt
            echo "" >> /tmp/get_cred_rcu.txt
            LINE=$(grep -n "^static inline void put_cred" include/linux/cred.h | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              head -n $((LINE - 1)) include/linux/cred.h > /tmp/cred_new.h
              cat /tmp/get_cred_rcu.txt >> /tmp/cred_new.h
              tail -n +$LINE include/linux/cred.h >> /tmp/cred_new.h
              mv /tmp/cred_new.h include/linux/cred.h
            fi
          fi

          echo 'CFLAGS_namespace.o += -Wno-unused-function' >> fs/Makefile

      - name: Setup SukiSU-Ultra (non-GKI)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

          # setup 成功时应有 drivers/kernelsu；部分 OEM 树只写了 source 行却没有目录
          if [ ! -f drivers/kernelsu/Kconfig ] && [ -f KernelSU/kernel/Kconfig ]; then
            rm -rf drivers/kernelsu
            ln -sfn ../KernelSU/kernel drivers/kernelsu
            echo "Linked drivers/kernelsu -> KernelSU/kernel"
          fi
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "ERROR: drivers/kernelsu/Kconfig still missing"
            ls -la KernelSU KernelSU/kernel drivers/kernelsu 2>&1 || true
            rg -n "kernelsu|KernelSU" drivers/Kconfig || true
            exit 1
          fi
          ls -la drivers/kernelsu | head

      - name: Build Kernel
        run: |
          cd kernel

          make O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            $DEFCONFIG

          # Enable KSU / non-GKI / optional KPM+SUSFS
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KALLSYMS
          scripts/config --file out/.config -e KALLSYMS_ALL
          scripts/config --file out/.config -e THREAD_INFO_IN_TASK
          if [ "$ENABLE_KPM" = "true" ]; then
            scripts/config --file out/.config -e KPM || true
          fi
          if [ "$ENABLE_SUSFS" = "true" ]; then
            scripts/config --file out/.config -e KSU_SUSFS
            scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH
            scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
            scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
            scripts/config --file out/.config -e KSU_SUSFS_SPOOF_UNAME
            scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG
            scripts/config --file out/.config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            scripts/config --file out/.config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            scripts/config --file out/.config -e KSU_SUSFS_OPEN_REDIRECT
            scripts/config --file out/.config -e KSU_SUSFS_SUS_MAP
          fi

          make O=out ARCH=arm64 olddefconfig

          echo "Config check:"
          grep -E "CONFIG_KSU|CONFIG_THREAD_INFO" out/.config | head -20

          make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Package
        run: |
          cd kernel
          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "Build failed!"
            exit 1
          fi

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git modules patch ramdisk
          cp ../out/arch/arm64/boot/Image .
          # OnePlus 8T (kebab); skip strict device check for Kernel Flasher / SukiSU manager
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=kebab/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=OnePlus8T/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=KB2001/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=KB2003/g' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=KB2005/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=1;/g' anykernel.sh

          ZIP_NAME="AnyKernel3_SukiSU_OP8T_${PROFILE_LABEL}_$(date +%Y%m%d).zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create boot.img
        run: |
          cd kernel
          BOOT_IMG="SukiSU_OP8T_${PROFILE_LABEL}_boot_$(date +%Y%m%d).img"
          lz4 -l -12 --favor-decSpeed "$GITHUB_WORKSPACE/lineage-os/ramdisk.cpio" ramdisk.cpio.lz4
          python3 $GITHUB_WORKSPACE/mkbootimg/mkbootimg.py \
            --kernel out/arch/arm64/boot/Image \
            --ramdisk ramdisk.cpio.lz4 \
            --dtb "$GITHUB_WORKSPACE/lineage-os/dtb" \
            --pagesize 4096 \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --dtb_offset 0x01f00000 \
            --header_version 2 \
            --os_version 16.0.0 \
            --os_patch_level 2025-12 \
            --cmdline "androidboot.hardware=qcom androidboot.memcg=1 androidboot.usbcontroller=a600000.dwc3 cgroup.memory=nokmem,nosocket loop.max_part=7 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 reboot=panic_warm service_locator.enable=1 swiotlb=2048" \
            --output "$GITHUB_WORKSPACE/$BOOT_IMG"
          echo "BOOT_IMG=$BOOT_IMG" >> $GITHUB_ENV
          ls -lh "$GITHUB_WORKSPACE/$BOOT_IMG"

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOOT_IMG }}
          path: ${{ env.BOOT_IMG }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sukisu-op8t-${{ github.run_number }}
          name: SukiSU-Ultra OnePlus 8T Build ${{ github.run_number }}
          body: |
            ## SukiSU-Ultra · OnePlus 8T (kebab) · non-GKI 4.19

            Profile: `${{ github.event.inputs.KERNEL_PROFILE }}`
            SUSFS: `${{ github.event.inputs.ENABLE_SUSFS }}` · KPM: `${{ github.event.inputs.ENABLE_KPM }}`

            ### Installation
            - Prefer TWRP / Kernel Flasher / SukiSU Manager (AnyKernel3 zip)
            - Or `fastboot flash boot` the boot.img (custom RAMDISK may not match stock)
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.BOOT_IMG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
